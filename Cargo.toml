[package]
name = "proxrs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
hmac = "0.13.0"
httparse = "1.10.1"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
libc = "0.2.191"
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa"] }
sha1 = "0.11.0"
shell-quote = { version = "0.8", default-features = false, features = ["sh", "bash", "fish"] }
ssh-key = "0.7.0-rc.11"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["full"] }
tokio-util = "0.7.20"
zeroize = "1.9.1"

[dev-dependencies]
tokio = { version = "1.54.0", features = ["test-util"] }

[patch.crates-io]
russh = { path = "vendor/russh" }
